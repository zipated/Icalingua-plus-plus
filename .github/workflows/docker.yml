name: Docker Build

on:
  push:
    branches:
      - napcat
    paths:
      - '.github/workflows/docker.yml'
  workflow_dispatch:

env:
  DOCKERHUB_IMAGE: zipated/icalingua-bridge-oicq
  ALIYUN_IMAGE: registry.cn-hangzhou.aliyuncs.com/zipated/icalingua-bridge-oicq
  TAG_PREFIX: git
  TAG_SUFFIX: ${{ github.ref_name }}
  ICALINGUA_SHORT_SHA: ce618e9
  NAPCAT_VERSION: 4.18.19

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Build tags
        id: tags
        run: |
          BASE="${TAG_PREFIX}-${TAG_SUFFIX}"
          SHA_TAG="${TAG_PREFIX}-${ICALINGUA_SHORT_SHA}-${TAG_SUFFIX}"
          VERSION_TAG="${TAG_PREFIX}-${ICALINGUA_SHORT_SHA}-${TAG_SUFFIX}-${NAPCAT_VERSION}"
          TAGS="${DOCKERHUB_IMAGE}:${BASE},${DOCKERHUB_IMAGE}:${SHA_TAG},${DOCKERHUB_IMAGE}:${VERSION_TAG}"
          TAGS="${TAGS},${ALIYUN_IMAGE}:${BASE},${ALIYUN_IMAGE}:${SHA_TAG},${ALIYUN_IMAGE}:${VERSION_TAG}"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.ALIYUN_IMAGE }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v2
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64